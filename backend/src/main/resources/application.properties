spring.application.name=gestion-parc-backend
server.port=8080

# H2 is used by default for local development. PostgreSQL can be selected with DB_* environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/gestion_parc}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
